# picom settings matching tools/bench/compust-blur.toml with the xrender backend.
# No shadows, fades, rounded corners, dimming, or unredirection, which Compust lacks.
vsync = true;
use-damage = true;
shadow = false;
fading = false;
corner-radius = 0;
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
unredir-if-possible = false;
blur-background = true;
# A box kernel of size 9 spans the same 4-pixel radius; xrender lacks dual_kawase.
blur-method = "box";
blur-size = 9;
