# picom settings matching tools/bench/compust.toml; the runner passes --backend.
# No shadows, fades, rounded corners, dimming, or unredirection, which Compust lacks.
vsync = true;
use-damage = true;
shadow = false;
fading = false;
corner-radius = 0;
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
unredir-if-possible = false;
blur-background = false;
