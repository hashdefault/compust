[package]
name = "compust"
version = "0.2.0-beta.3"
edition = "2024"
rust-version = "1.95"
description = "A small experimental X11 compositor written in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/hashdefault/compust"
keywords = ["x11", "compositor", "xorg", "xlibre"]
categories = ["gui"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rustix = { version = "1", features = ["event"] }
serde = { version = "1", features = ["derive"] }
signal-hook = "0.3"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x11rb = { version = "0.13.2", features = ["composite", "damage", "render", "xfixes", "shape", "randr", "present", "dri3", "sync"] }

[dev-dependencies]
tempfile = "3"
x11rb = { version = "0.13.2", features = ["res"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
allow_attributes = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
